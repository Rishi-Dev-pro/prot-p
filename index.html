<!doctype html>
<html lang="en" class="dark scroll-smooth is-booting">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Rishi Kumar Shaw — Full-Stack Developer & AI Systems Builder</title>
    <meta name="title" content="Rishi Kumar Shaw — Full-Stack Developer & AI Systems Builder" />
    <meta name="description" content="Portfolio of Rishi Kumar Shaw. Full-Stack Developer, AI Systems Builder, and Experimental Engineer exploring intelligent systems, computer vision, and experimental software architecture." />
    <meta name="theme-color" content="#08090D" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rishi Kumar Shaw — Full-Stack Developer & AI Systems Builder" />
    <meta property="og:description" content="Engineering the unexpected. Exploring the intersection of software engineering, artificial intelligence, computer vision, and intelligent systems." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Zero-Flash Initialization Shield -->
    <style id="booting-shield">
      html.is-booting body {
        overflow: hidden !important;
      }
      html.is-booting #main-content,
      html.is-booting #navbar,
      body.is-booting #main-content,
      body.is-booting #navbar {
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // Enforce is-booting class before first browser paint
      document.documentElement.classList.add('is-booting');
      // Hard safety fail-safe: Ensure page is NEVER permanently blank after 8s under any circumstance
      setTimeout(function() {
        if (document.documentElement.classList.contains('is-booting')) {
          document.documentElement.classList.remove('is-booting');
        }
      }, 8000);
    </script>
  </head>
  <body class="bg-[#08090D] text-[#F3F3F5] antialiased selection:bg-[#FF414D] selection:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
